name: trainplane
services:
  ray:
    image: trainplane-backend:local
    build: ./backend
    command: [python, -m, ray.scripts.scripts, start, --head, --block, --num-cpus=2, --num-gpus=0, --port=6380, --dashboard-host=0.0.0.0, --dashboard-port=8265, --object-store-memory=83886080, --disable-usage-stats]
    init: true
    shm_size: 128mb
    ports:
      - "127.0.0.1:8265:8265"
    volumes:
      - ./backend/data:/app/data
      - ./backend/yolov8n.pt:/app/yolov8n.pt:ro
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8265/api/version', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 30
  api:
    image: trainplane-backend:local
    build: ./backend
    # Both containers see the same Linux PIDs, so cancellation and recovery can verify process identities.
    pid: "service:ray"
    environment:
      TRAINPLANE_DATA_DIR: /app/data
      REDIS_URL: redis://redis:6379/0
      RAY_ADDRESS: http://ray:8265
      TOTAL_CPUS: "2"
    volumes:
      - ./backend/data:/app/data
      - ./backend/yolov8n.pt:/app/yolov8n.pt:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      ray:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, "yes", --maxmemory, 128mb, --maxmemory-policy, noeviction]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 2s
      retries: 20
    restart: unless-stopped
volumes:
  redis-data:


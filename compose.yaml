name: trainplane
services:
  ray:
    image: trainplane-backend:local
    build: ./backend
    command: [python, -m, ray.scripts.scripts, start, --head, --block, "--num-cpus=${TOTAL_CPUS:-2}", --num-gpus=0, --port=6380, --dashboard-host=0.0.0.0, --dashboard-port=8265, --object-store-memory=83886080, --disable-usage-stats]
    init: true
    cpus: "${TOTAL_CPUS:-2}"
    shm_size: 128mb
    environment:
      EXECUTION_MODE: docker
      DOCKER_HOST: unix:///var/run/docker.sock
      TRAIN_IMAGE: trainplane-backend:local
    volumes:
      - ./backend/data:/app/data
      - ./backend/yolov8n.pt:/app/yolov8n.pt:ro
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8265/api/version', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 30
  api:
    image: trainplane-backend:local
    build: ./backend
    # Both containers see the same Linux PIDs, so cancellation and recovery can verify process identities.
    pid: "service:ray"
    environment:
      TRAINPLANE_DATA_DIR: /app/data
      REDIS_URL: redis://redis:6379/0
      RAY_ADDRESS: http://ray:8265
      TOTAL_CPUS: "${TOTAL_CPUS:-2}"
      TOTAL_MEMORY_MB: "${TOTAL_MEMORY_MB:-2048}"
      DEFAULT_MEMORY_MB: "${DEFAULT_MEMORY_MB:-1024}"
      AGING_INTERVAL_SECONDS: "${AGING_INTERVAL_SECONDS:-60}"
      BACKFILL_MAX_BYPASS: "${BACKFILL_MAX_BYPASS:-3}"
      EXECUTION_MODE: docker
      DOCKER_HOST: unix:///var/run/docker.sock
      TRAIN_IMAGE: trainplane-backend:local
      TRAINPLANE_API_TOKEN: "${TRAINPLANE_API_TOKEN:-}"
      TRAINPLANE_TOKEN_FILE: /app/auth/api-token
      HEARTBEAT_TIMEOUT: "${HEARTBEAT_TIMEOUT:-15}"
      HEARTBEAT_STARTUP_GRACE: "${HEARTBEAT_STARTUP_GRACE:-90}"
      SCHEDULER_INTERVAL: "${SCHEDULER_INTERVAL:-1}"
    volumes:
      - ./backend/data:/app/data
      - ./backend/yolov8n.pt:/app/yolov8n.pt:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./backend/.auth:/app/auth
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      ray:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, "yes", --maxmemory, 128mb, --maxmemory-policy, noeviction]
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 2s
      retries: 20
    restart: unless-stopped
volumes:
  redis-data:

